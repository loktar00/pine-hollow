<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pine Hollow - a living ski hill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M2 20 L9 7 L13 13 L16 9 L22 20 Z%27 fill=%27%232f6fde%27/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe4f7; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #17324a; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(255,255,255,0) 58%, rgba(40,70,120,0.20) 100%); }
  .chip { position: fixed; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.9); border-radius: 999px; padding: 7px 14px; box-shadow: 0 4px 18px rgba(30,60,110,0.16); backdrop-filter: blur(6px); }
  #brand { left: 18px; top: 16px; padding: 8px 16px 8px 12px; display: flex; align-items: center; gap: 9px; }
  #brand svg { width: 22px; height: 22px; }
  #title { font-weight: 700; letter-spacing: 0.04em; font-size: 15px; }
  #sub { font-size: 11px; opacity: 0.66; margin-left: 2px; }
  #fps { right: 18px; top: 16px; font-size: 12px; font-variant-numeric: tabular-nums; }
  #fps.hide { display: none; }
  #caption { left: 50%; bottom: 46px; transform: translate(-50%, 12px); font-size: 15px; font-weight: 600; padding: 9px 20px; opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; white-space: nowrap; }
  #caption.show { opacity: 1; transform: translate(-50%, 0); }
  #sound { right: 18px; bottom: 34px; font-size: 12px; cursor: pointer; user-select: none; font-weight: 600; }
  #sound.on { background: rgba(255,255,255,0.6); font-weight: 400; }
  #credits { position: fixed; right: 18px; bottom: 10px; left: 18px; text-align: right; font-size: 10.5px; color: rgba(23,50,74,0.72); text-shadow: 0 1px 0 rgba(255,255,255,0.7); pointer-events: none; }
  .tag { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; background: rgba(255,255,255,0.86); border-radius: 10px; padding: 5px 11px 6px; box-shadow: 0 4px 16px rgba(20,40,90,0.22); text-align: center; white-space: nowrap; will-change: transform; }
  .tag:after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: rgba(255,255,255,0.86); border-bottom: 0; }
  .tag b { display: block; font-size: 15px; letter-spacing: 0.02em; } .tag span { font-size: 11.5px; opacity: 0.75; }
  #replay { position: fixed; left: 26px; top: 76px; font-weight: 800; font-size: 20px; letter-spacing: 0.22em; color: #fff; background: #e5383b; padding: 6px 14px 6px 18px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; box-shadow: 0 4px 16px rgba(120,20,20,0.35); }
  #replay.show { opacity: 1; }
  body.rec #brand, body.rec #fps, body.rec #sound, body.rec #caption { display: none; } body.rec #c { cursor: none; } body.rec #replay { top: 26px; transition: none; } body.rec .tag { transition: none; }
  #lost { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(207,228,247,0.94); font-size: 18px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>
<div id="replay">REPLAY</div>
<div id="brand" class="chip"><svg viewBox="0 0 24 24"><path d="M2 20 L9 7 L13 13 L16 9 L22 20 Z" fill="#2f6fde"/><path d="M9 7 L11 10 L9.6 11.4 L8 10.4 L7 11.2 Z" fill="#fff"/><path d="M12 2 L15.2 7.4 H13.6 L16.4 11.6 H7.6 L10.4 7.4 H8.8 Z" fill="#1f5d4b" transform="translate(4.5 5) scale(0.55)"/></svg><span id="title">Pine Hollow</span><span id="sub">a living ski hill</span></div>
<div id="fps" class="chip">-- fps</div>
<div id="caption" class="chip"></div>
<div id="sound" class="chip">Click anywhere for sound</div>
<div id="credits"></div>
<div id="lost">The 3D view was lost (WebGL context lost).<br>Reload the page to bring the hill back. If it keeps happening, restart the browser.</div>

<script>/*__GAME__*/</script>
</body>
</html>
